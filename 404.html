<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Ксения Вострякова</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #111111;
    --muted: #949494;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
  }

  body {
    font-family: 'Roboto Condensed', Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .video-bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }

  .card {
    background: rgba(255, 255, 255, 0.92);
    padding: 2.2rem 2.8rem;
    max-width: 420px;
  }

  .code {
    font-size: 0.78rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 0.8rem;
  }

  .message {
    font-size: 1.15rem;
    color: var(--ink);
    margin: 0 0 1.6rem;
  }

  .back {
    display: inline-block;
    font-size: 0.8rem;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--ink);
  }

  .back:hover { color: var(--muted); border-bottom-color: var(--muted); }
</style>
</head>
<body>

<video class="video-bg" autoplay loop muted playsinline>
  <source src="assets/404-loop.mp4" type="video/mp4">
</video>

<div class="overlay">
  <div class="card">
    <p class="code">404</p>
    <p class="message">Такой страницы не существует.</p>
    <a class="back" href="/">На главную</a>
  </div>
</div>

</body>
</html>
