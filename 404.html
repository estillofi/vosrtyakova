<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Ксения Вострякова</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --ink: #111111;
    --muted: #949494;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #ffffff;
  }

  body {
    font-family: 'Roboto Condensed', Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
  }

  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .loop-video {
    width: 100%;
    max-width: 320px;
    height: auto;
    display: block;
    margin: 0 0 2rem;
  }

  .code {
    font-size: 0.78rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 0.8rem;
  }

  .message {
    font-size: 1.15rem;
    color: var(--ink);
    margin: 0 0 1.6rem;
  }

  .back {
    display: inline-block;
    font-size: 0.8rem;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--ink);
  }

  .back:hover { color: var(--muted); border-bottom-color: var(--muted); }
</style>
</head>
<body>

<div class="wrap">
  <video class="loop-video" autoplay loop muted playsinline>
    <source src="assets/404-loop.mp4" type="video/mp4">
  </video>
  <p class="code">404</p>
  <p class="message">Такой страницы не существует.</p>
  <a class="back" href="/">На главную</a>
</div>

</body>
</html>
